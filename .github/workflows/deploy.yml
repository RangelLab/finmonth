name: Deploy FinMonth to GitHub Pages
on:
  repository_dispatch:
    types:
      - deploy-finmonth
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout principal repository
        uses: actions/checkout@v4
        with:
          repository: jeffersonrcs-cmd/finmonth
          ref: main
          token: ${{ secrets.FINMONTH_SOURCE_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build FinMonth App
        run: |
          npm run build
          rm -rf dist/confirmar-email
          rm -rf dist/historico
          rm -rf dist/redefinir-senha
          cp dist/index.html dist/404.html
          mkdir -p dist/confirmar-email
          mkdir -p dist/historico
          mkdir -p dist/redefinir-senha
          cp dist/index.html dist/confirmar-email/index.html
          cp dist/index.html dist/historico/index.html
          cp dist/index.html dist/redefinir-senha/index.html
          mkdir -p dist/oauth/start
          mkdir -p dist/oauth/callback
          cp dist/index.html dist/oauth/start/index.html
          cp dist/index.html dist/oauth/callback/index.html
          rsync -a --exclude='*.html' public/ dist/
          touch dist/.nojekyll
        env:
          VITE_BASE_PATH: /finmonth/
          VITE_SUPABASE_URL: https://wtumeplxmynbojdhgpej.supabase.co
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4